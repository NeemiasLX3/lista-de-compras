  <title>Lista de Compras</title>
  <style>
/* Base local: reset e comportamentos essenciais da interface. */

body { width:100%; min-width:0; min-height:100vh; margin:0; overflow-x:hidden; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","Liberation Sans",Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji"; }

.home-list-grid { display:grid; min-width:0; gap:.65rem; }.saved-list-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; width:100%; max-width:100%; min-width:0; min-height:76px; gap:.8rem; padding:.9rem 1rem; overflow:hidden; touch-action:pan-y; background:var(--surface); border:0; border-radius:.85rem; box-shadow:0 1px 5px #00000012; cursor:grab; transition:.15s; }.saved-list-card:hover { box-shadow:0 4px 12px #0000001a; transform:translateY(-1px); }.saved-list-card.is-dragging,.product-card.is-dragging { opacity:.58; cursor:grabbing; box-shadow:0 10px 22px #0000002b; }.saved-list-icon { font-size:1.35rem; }.saved-list-info { display:flex; flex-direction:column; width:100%; min-width:0; gap:.12rem; }.saved-list-info strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.saved-list-info small { color:#94a3b8; font-size:.78rem; }.saved-list-actions { display:flex; align-items:center; gap:.15rem; min-width:0; }.btn-card-action { flex:0 0 auto; background:transparent; border:0; border-radius:.45rem; padding:.32rem; color:#64748b; font-size:1.2rem; line-height:1; }.btn-card-action:hover { background:#e2e8f0; }.delete-list-btn { color:var(--danger); font-size:1.15rem; }.delete-list-btn:hover { background:#fee2e2; }.share-list-btn { font-size:1rem; }
.top-bar { display:flex; align-items:center; gap:.65rem; min-width:0; max-width:100%; padding:1rem 1rem .5rem; }.btn-home { width:34px; height:34px; border:0; border-radius:.5rem; background:var(--control); color:var(--control-ink); font-size:1.55rem; line-height:1; }.btn-home:hover { filter:brightness(.94); }.list-title-button { min-width:0; flex:1; display:flex; align-items:center; gap:.35rem; padding:.35rem; border:0; background:transparent; text-align:left; color:var(--ink); border-radius:.45rem; }.list-title-button:hover { background:var(--control); }.list-title { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:1rem; font-weight:800; }.edit-list-icon { flex:0 0 auto; color:#64748b; font-size:1.1rem; }.theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; flex:0 0 34px; padding:0; border:0; border-radius:.5rem; background:var(--control); color:var(--control-ink); font-size:1.1rem; line-height:1; }.theme-toggle:hover { filter:brightness(.94); }.empty-theme-toggle { position:fixed; top:1rem; right:1rem; z-index:2; }
.total-box { display:flex; justify-content:space-between; align-items:center; padding:.75rem 1rem 0; }.total-value { color:var(--total-green); font-size:2.25rem; letter-spacing:-.5px; font-weight:850; transition:color .2s ease; }.total-value.is-over-budget { color:var(--danger); text-shadow: 0 0 14px #ff746d; }.total-weight { margin-top:-.15rem; color:#6b7280; font-size:.82rem; font-weight:650; }.btn-fab { display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; padding:0 0 6px 0; border:0; border-radius:50%; background:var(--green); color:#fff; font-size:2rem; line-height:1; box-shadow:0 4px 14px #16a34a61; }.btn-fab:hover { transform:scale(1.06); }.product-list { padding:.5rem 1rem 5rem; }.empty-state { margin-top:2.5rem; text-align:center; color:#9ca3af; line-height:1.7; }

.modal { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; padding:1rem; overflow-x:hidden; overflow-y:auto; outline:0; background:#0f172a88; }.modal.is-open { display:flex; }.modal-dialog { position:relative; width:min(100%,440px); margin:auto; }.modal-content { position:relative; display:flex; flex-direction:column; width:100%; pointer-events:auto; background:#fff; padding:1.25rem; border-radius:.9rem; box-shadow:0 20px 45px #0f172a4d; }.modal-heading { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; }.modal-heading h2 { margin:0; font-size:1.18rem; }.btn-close { width:30px; height:30px; border:0; border-radius:.4rem; background:transparent; color:#64748b; font-size:1.6rem; line-height:1; }.btn-close:hover { background:#e2e8f0; }.modal-text { margin:0; color:#64748b; line-height:1.5; }.form-label,.form-field { display:block; color:#64748b; font-size:.86rem; font-weight:650; }.form-control { display:block; width:100%; min-height:2.7rem; margin-top:.35rem; padding:.55rem .7rem; font-weight:400; line-height:1.5; color:#172033; appearance:none; background:#fff; background-clip:padding-box; border:1px solid #cbd5e1; border-radius:.55rem; outline:none; transition:border-color .15s ease-in-out,box-shadow .15s ease-in-out; }.form-control::placeholder { color:#6c757d; opacity:1; }.form-control:focus { border-color:#16a34a; box-shadow:0 0 0 3px #16a34a24; }.form-control:disabled { background-color:#e9ecef; opacity:1; }.form-control[type="file"] { overflow:hidden; }.form-control[type="file"]:not(:disabled):not([readonly]) { cursor:pointer; } select.form-control { appearance:auto; } .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.85rem; }.form-field-wide { grid-column:1 / -1; }.optional-label { font-weight:400; }.quantity-control { display:flex; align-items:center; margin-top:.35rem; }.quantity-control button { width:2.35rem; height:2.7rem; border:1px solid #cbd5e1; background:#f8fafc; font-size:1.2rem; }.quantity-control button:first-child { border-radius:.55rem 0 0 .55rem; }.quantity-control button:last-child { border-radius:0 .55rem .55rem 0; }.quantity-control input { margin:0; border-radius:0; text-align:center; }.modal-footer { display:flex; gap:.55rem; margin-top:1.25rem; }.modal-footer .btn { flex:1; } body.modal-open { overflow:hidden; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
body.dark-theme { --bg:#151a1d; --surface:#20272b; --ink:#e7eeea; --muted:#aab8b3; --danger:#ff746d; --control:#2a3438; --control-ink:#e2ebe6; --field-border:#435157; --field-bg:#1b2226; --green:#46bd75; }
body.dark-theme .saved-list-card,body.dark-theme .product-card,body.dark-theme .modal-content { box-shadow:0 2px 9px #00000040; }
body.dark-theme .product-card.excluded { background:#293237; }
body.dark-theme .product-name,body.dark-theme .saved-list-info strong { color:var(--ink); }
body.dark-theme .total-weight,body.dark-theme .product-weight,body.dark-theme .saved-list-info small,body.dark-theme .modal-text,body.dark-theme .form-label,body.dark-theme .form-field { color:var(--muted); }
body.dark-theme .form-control { color:var(--ink); background:var(--field-bg); border-color:var(--field-border); }
body.dark-theme .form-control::placeholder { color:#8c9b96; }
body.dark-theme .quantity-control button { color:var(--ink); background:#273136; border-color:var(--field-border); }
body.dark-theme .btn-secondary { color:#e2ebe6; background:#39464b; }
body.dark-theme .btn-danger-outline { color:#ff9b95; background:transparent; border-color:#a9504b; }
body.dark-theme .action-btn,body.dark-theme .btn-card-action,body.dark-theme .edit-list-icon { color:#b8c6c1; }

/* Estado visual do módulo Ddrop e acabamento dos modais no tema noturno. */
.saved-list-card.is-dragging,.product-card.is-dragging { display:none; }
.ddrop-placeholder { border:2px dashed #86efac; border-radius:.9rem; background:#dcfce733; pointer-events:none; }
.ddrop-preview { position:fixed; z-index:100; margin:0; pointer-events:none; transform:translate3d(var(--ddrop-x),var(--ddrop-y),0) scale(.94); transform-origin:center; opacity:.94; box-shadow:0 18px 35px #0000003b; cursor:grabbing; will-change:transform; }
.modal-content { background:var(--surface); }
body.dark-theme .btn-close:hover { background:#39464b; }
body.dark-theme .ddrop-placeholder { border-color:#46bd75; background:#46bd7526; }
@media (max-width:380px) { .home-header { align-items:flex-start; }.home-header h1 { font-size:1.25rem; }.btn-create-list { padding:.6rem .7rem; font-size:.78rem; }.product-card { padding:.75rem; }.product-info { gap:.4rem; }.product-actions { gap:0; }.action-btn,.remove-btn { min-width:28px; }.form-grid { grid-template-columns:1fr; }.form-field-wide { grid-column:auto; } }
  </style>
</head>
<body>
  <main class="home-screen" id="homeScreen"></main>

  <main class="app-wrapper is-hidden" id="shoppingApp">
    <header class="top-bar">
      <button class="btn-home" onclick="requestGoHome()" aria-label="Voltar para minhas listas" title="Minhas listas">⌂</button>
      <button class="list-title-button" onclick="openRenameListModal()" aria-label="Editar nome da lista" title="Editar nome da lista">
        <span class="list-title" id="currentListName">Lista de compras</span><span class="edit-list-icon" aria-hidden="true">✎</span>
      </button>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema" title="Alternar tema">☾</button>
    </header>

    <section class="total-box" aria-label="Totais da lista">
      <div>
        <div id="totalPrice" class="total-value">R$ 0,00</div>
        <div id="totalWeight" class="total-weight">Peso total: 0 kg</div>
      </div>
      <button class="btn-fab" onclick="openProductModal()" aria-label="Adicionar produto">+</button>
    </section>

    <section id="productList" class="product-list" aria-live="polite"></section>
  </main>

  <div class="modal" id="listModal" role="dialog" aria-modal="true" aria-labelledby="listModalTitle" onclick="closeOnBackdrop(event, 'listModal')">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-heading">
          <h2 id="listModalTitle">Nova lista</h2>
          <button class="btn-close" onclick="hideModal('listModal')" aria-label="Fechar">×</button>
        </div>
        <label for="listNameInput" class="form-label" id="listNameLabel">Nome da lista</label>
        <input type="text" class="form-control" id="listNameInput" placeholder="Ex.: Mercado da semana" maxlength="80">
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="hideModal('listModal')">Cancelar</button>
          <button type="button" class="btn btn-primary" id="listModalSubmit" onclick="submitListModal()">Criar lista</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="leaveListModal" role="dialog" aria-modal="true" aria-labelledby="leaveListTitle" onclick="closeOnBackdrop(event, 'leaveListModal')">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-heading">
          <h2 id="leaveListTitle">Salvar alterações?</h2>
          <button class="btn-close" onclick="hideModal('leaveListModal')" aria-label="Continuar editando">×</button>
        </div>
        <p class="modal-text">Escolha salvar as alterações desta lista ou esquecê-las antes de voltar.</p>
        <div class="modal-footer">
          <button type="button" class="btn btn-danger-outline" onclick="discardAndGoHome()">Esquecer</button>
          <button type="button" class="btn btn-primary" onclick="saveAndGoHome()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle" onclick="closeOnBackdrop(event, 'productModal')">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-heading">
          <h2 id="productModalTitle">Adicionar produto</h2>
          <button class="btn-close" onclick="hideModal('productModal')" aria-label="Fechar">×</button>
        </div>
        <form id="productForm" onsubmit="saveProduct(event)">
          <div class="form-grid">
            <label class="form-field form-field-wide">Nome do produto
              <input type="text" class="form-control" id="productName" placeholder="Ex.: Arroz">
            </label>
            <label class="form-field">Valor (R$)
              <input type="text" class="form-control" id="productPrice" inputmode="decimal" autocomplete="off" placeholder="0,00" required>
            </label>
            <label class="form-field">Quantidade
              <span class="quantity-control">
                <button type="button" onclick="changeQuantity(-1)" aria-label="Diminuir quantidade">−</button>
                <input type="number" class="form-control" id="productQuantity" value="1" min="1" inputmode="numeric" required>
                <button type="button" onclick="changeQuantity(1)" aria-label="Aumentar quantidade">+</button>
              </span>
            </label>
            <label class="form-field">Peso ou volume un. <span class="optional-label">(opcional)</span>
              <input type="text" class="form-control" id="productWeight" inputmode="decimal" autocomplete="off" placeholder="0,000">
            </label>
            <label class="form-field">Unidade
              <select class="form-control" id="productWeightUnit" aria-label="Unidade de medida">
                <optgroup label="Massa">
                  <option value="kg" selected>Quilograma (kg)</option>
                  <option value="g">Grama (g)</option>
                  <option value="mg">Miligrama (mg)</option>
                </optgroup>
                <optgroup label="Volume">
                  <option value="l">Litro (L)</option>
                  <option value="ml">Mililitro (ml)</option>
                  <option value="kl">Quilolitro (kL)</option>
                </optgroup>
              </select>
            </label>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="hideModal('productModal')">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar produto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" onclick="closeOnBackdrop(event, 'confirmModal')">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-heading">
          <h2 id="confirmModalTitle">Excluir lista?</h2>
          <button class="btn-close" onclick="hideModal('confirmModal')" aria-label="Cancelar">×</button>
        </div>
        <p class="modal-text" id="confirmModalText"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="hideModal('confirmModal')">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmModalAction" onclick="confirmPendingDeletion()">Excluir permanentemente</button>
        </div>
      </div>
    </div>
  </div>

  <script>
/* Drag-and-drop local e opcional. Nenhuma biblioteca externa é necessária. */
(() => {
  const INTERACTIVE = 'button, input, select, textarea, a, label';
  const HOLD_DELAY = 220;
  const MOVE_THRESHOLD = 5;

  const initialize = (container, type, onReorder) => {
    if (!container) return;
    container.__ddropDestroy?.();

    let state = null;
    let holdTimer = null;
    let suppressClick = false;

    const clearHold = () => {
      if (holdTimer) window.clearTimeout(holdTimer);
      holdTimer = null;
    };

    const updatePreview = (event) => {
      if (!state?.preview) return;
      const margin = 10;
      const width = state.preview.offsetWidth * 0.94;
      const height = state.preview.offsetHeight * 0.94;
      const maxLeft = Math.max(margin, window.innerWidth - width - margin);
      const maxTop = Math.max(margin, window.innerHeight - height - margin);
      const left = Math.min(Math.max(event.clientX - state.offsetX, margin), maxLeft);
      const top = Math.min(Math.max(event.clientY - state.offsetY, margin), maxTop);
      state.preview.style.setProperty('--ddrop-x', `${left}px`);
      state.preview.style.setProperty('--ddrop-y', `${top}px`);
    };

    const placePlaceholder = (event) => {
      if (!state?.placeholder) return;
      const candidates = [...container.querySelectorAll('[data-reorder-id]')].filter(item => item !== state.item);
      const target = candidates.find(item => {
        const rect = item.getBoundingClientRect();
        return event.clientY < rect.top + rect.height / 2;
      });
      if (target) container.insertBefore(state.placeholder, target);
      else container.append(state.placeholder);
    };

    const activate = (event) => {
      if (!state || state.active) return;
      const { item } = state;
      const rect = item.getBoundingClientRect();
      const placeholder = document.createElement('div');
      placeholder.className = 'ddrop-placeholder';
      placeholder.style.height = `${rect.height}px`;
      placeholder.style.marginBottom = getComputedStyle(item).marginBottom;

      const preview = item.cloneNode(true);
      preview.classList.add('ddrop-preview');
      preview.removeAttribute('id');
      preview.setAttribute('aria-hidden', 'true');
      preview.style.width = `${rect.width}px`;
      preview.style.height = `${rect.height}px`;
      document.body.append(preview);

      state.active = true;
      state.placeholder = placeholder;
      state.preview = preview;
      state.offsetX = Math.min(Math.max(event.clientX - rect.left, 0), rect.width);
      state.offsetY = Math.min(Math.max(event.clientY - rect.top, 0), rect.height);
      item.classList.add('is-dragging');
      item.before(placeholder);
      item.setPointerCapture?.(state.pointerId);
      updatePreview(event);
    };

    const finish = () => {
      clearHold();
      if (!state) return;
      const wasActive = state.active;
      const { item, placeholder, preview } = state;
      if (wasActive && item.hasPointerCapture?.(state.pointerId)) item.releasePointerCapture(state.pointerId);
      preview?.remove();
      item.classList.remove('is-dragging');
      if (wasActive && placeholder?.isConnected) {
        placeholder.replaceWith(item);
        const order = [...container.querySelectorAll('[data-reorder-id]')].map(element => element.dataset.reorderId);
        onReorder?.(order, type);
        suppressClick = true;
        window.setTimeout(() => { suppressClick = false; }, 0);
      }
      state = null;
    };

    const onPointerDown = (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      if (event.target.closest(INTERACTIVE)) return;
      const item = event.target.closest('[data-reorder-id]');
      if (!item || !container.contains(item)) return;
      state = { item, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, active: false };
      holdTimer = window.setTimeout(() => activate(event), HOLD_DELAY);
    };

    const onPointerMove = (event) => {
      if (!state || event.pointerId !== state.pointerId) return;
      const distance = Math.hypot(event.clientX - state.startX, event.clientY - state.startY);
      if (!state.active && distance > MOVE_THRESHOLD) {
        clearHold();
        activate(event);
      }
      if (!state.active) return;
      event.preventDefault();
      updatePreview(event);
      placePlaceholder(event);
    };

    const onClick = event => { if (suppressClick) { event.preventDefault(); event.stopPropagation(); } };
    container.addEventListener('pointerdown', onPointerDown);
    container.addEventListener('pointermove', onPointerMove, { passive: false });
    container.addEventListener('pointerup', finish);
    container.addEventListener('pointercancel', finish);
    container.addEventListener('click', onClick, true);
    container.__ddropDestroy = () => {
      clearHold();
      finish();
      container.removeEventListener('pointerdown', onPointerDown);
      container.removeEventListener('pointermove', onPointerMove);
      container.removeEventListener('pointerup', finish);
      container.removeEventListener('pointercancel', finish);
      container.removeEventListener('click', onClick, true);
    };
  };

  window.Ddrop = { initialize };
})();

// Listas de compras: todos os dados e recursos funcionam localmente, sem internet.
const LOCAL_LISTS_KEY = 'shopping_lists_local_v1';
const LOCAL_THEME_KEY = 'shopping_theme_v1';
const LEGACY_WORKING_KEY = 'lista_working_v2';
const LEGACY_LISTS_KEY = 'lista_saved_lists_v2';

let shoppingLists = [];
let currentListId = null;
let products = [];
let originalProducts = [];
let nextId = 1;
let editingProductId = null;
let listModalMode = 'create';
let pendingDeleteListId = null;
let pendingDeleteProductId = null;
let lastTotalCents = null;
let ignoreNextListOpen = false;

const $ = id => document.getElementById(id);
const clone = value => JSON.parse(JSON.stringify(value));
const createId = () => `list-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
const MEASUREMENTS = {
  kg: { kind: 'mass', factor: 1, label: 'kg' },
  g: { kind: 'mass', factor: 0.001, label: 'g' },
  mg: { kind: 'mass', factor: 0.000001, label: 'mg' },
  l: { kind: 'volume', factor: 1, label: 'L' },
  ml: { kind: 'volume', factor: 0.001, label: 'ml' },
  kl: { kind: 'volume', factor: 1000, label: 'kL' },
};

// Aceita vírgula ou ponto na entrada e converte para número sem ambiguidade.
const parseBrazilianNumber = value => {
  const text = String(value ?? '').trim();
  if (!text) return Number.NaN;
  const lastComma = text.lastIndexOf(',');
  const lastDot = text.lastIndexOf('.');
  const decimalIndex = Math.max(lastComma, lastDot);
  const integerPart = (decimalIndex >= 0 ? text.slice(0, decimalIndex) : text).replace(/\D/g, '');
  const decimalPart = decimalIndex >= 0 ? text.slice(decimalIndex + 1).replace(/\D/g, '') : '';
  const normalized = `${integerPart || '0'}${decimalIndex >= 0 ? `.${decimalPart}` : ''}`;
  return Number(normalized);
};

const normalizeBrazilianDecimalInput = value => {
  const text = String(value ?? '');
  const lastComma = text.lastIndexOf(',');
  const lastDot = text.lastIndexOf('.');
  const decimalIndex = Math.max(lastComma, lastDot);
  const integerPart = (decimalIndex >= 0 ? text.slice(0, decimalIndex) : text).replace(/\D/g, '');
  const decimalPart = decimalIndex >= 0 ? text.slice(decimalIndex + 1).replace(/\D/g, '') : '';
  if (decimalIndex < 0) return integerPart;
  return `${integerPart || '0'},${decimalPart}`;
};

const formatBrazilianNumber = (value, minimumFractionDigits = 0, maximumFractionDigits = 3) => Number(value).toLocaleString('pt-BR', { minimumFractionDigits, maximumFractionDigits });
const formatCurrency = value => `R$ ${formatBrazilianNumber(value, 2, 2)}`;
const formatCurrencyFromCents = cents => formatCurrency(cents / 100);
const toCents = value => Math.round((Number(value) + Number.EPSILON) * 100);
const parseBrazilianMoneyToCents = value => {
  const normalized = normalizeBrazilianDecimalInput(value);
  if (!normalized) return Number.NaN;
  const [integerPart, fractionPart = ''] = normalized.split(',');
  const whole = Number(integerPart || 0);
  if (!Number.isSafeInteger(whole)) return Number.NaN;
  const centsDigits = `${fractionPart}00`;
  let cents = whole * 100 + Number(centsDigits.slice(0, 2));
  if (Number(centsDigits.charAt(2)) >= 5) cents += 1;
  return cents;
};
const formatTotalWeight = weightInKg => {
  if (weightInKg === 0) return '0 kg';
  if (Math.abs(weightInKg) >= 1) return `${formatBrazilianNumber(weightInKg, 0, 3)} kg`;
  if (Math.abs(weightInKg) >= 0.001) return `${formatBrazilianNumber(weightInKg * 1000, 0, 3)} g`;
  return `${formatBrazilianNumber(weightInKg * 1000000, 0, 3)} mg`;
};
const formatTotalVolume = volumeInLiters => {
  if (volumeInLiters === 0) return '0 L';
  if (Math.abs(volumeInLiters) >= 1000) return `${formatBrazilianNumber(volumeInLiters / 1000, 0, 3)} kL`;
  if (Math.abs(volumeInLiters) >= 1) return `${formatBrazilianNumber(volumeInLiters, 0, 3)} L`;
  return `${formatBrazilianNumber(volumeInLiters * 1000, 0, 3)} ml`;
};

const normalizeProduct = product => ({
  ...product,
  id: Number(product.id) || 0,
  name: product.name || 'Item sem nome',
  priceCents: Math.max(0, Number.isInteger(product.priceCents) ? product.priceCents : toCents(product.price)),
  price: Math.max(0, Number(product.price) || 0),
  quantity: Math.max(1, Number.parseInt(product.quantity, 10) || 1),
  measurementUnit: MEASUREMENTS[product.measurementUnit] ? product.measurementUnit : (MEASUREMENTS[product.weightUnit] ? product.weightUnit : 'kg'),
  measurement: Math.max(0, Number(product.measurement ?? product.weight) || 0), // kg para massa, L para volume
  excluded: Boolean(product.excluded),
});

const normalizeList = list => ({
  ...list,
  id: String(list.id || createId()),
  name: String(list.name || 'Lista sem nome'),
  products: (list.products || list.items || []).map(normalizeProduct),
  nextId: Number(list.nextId) || 1,
  updatedAt: list.updatedAt || Date.now(),
});

const getNextProductId = productList => productList.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;

const migrateLegacyData = () => {
  const imported = [];
  try {
    JSON.parse(localStorage.getItem(LEGACY_LISTS_KEY) || '[]').forEach(list => imported.push(normalizeList(list)));
    const working = JSON.parse(localStorage.getItem(LEGACY_WORKING_KEY) || 'null');
    if (working?.products?.length && !imported.some(list => list.id === String(working.currentListId))) {
      imported.push(normalizeList({ id: working.currentListId || createId(), name: working.currentListName || 'Lista recuperada', products: working.products, nextId: working.nextId }));
    }
  } catch (error) { console.warn('Não foi possível migrar listas antigas:', error); }
  return imported;
};

const persistLists = () => localStorage.setItem(LOCAL_LISTS_KEY, JSON.stringify(shoppingLists));
const loadLists = () => {
  try {
    const stored = localStorage.getItem(LOCAL_LISTS_KEY);
    shoppingLists = stored ? JSON.parse(stored).map(normalizeList) : migrateLegacyData();
    persistLists();
  } catch (error) { console.warn('Não foi possível carregar as listas:', error); shoppingLists = []; }
};

// Modais locais, fecháveis pelo X, Escape ou pelo fundo.
const showModal = id => {
  const modal = $(id);
  modal.classList.add('is-open');
  document.body.classList.add('modal-open');
  const firstField = modal.querySelector('input, select, button');
  setTimeout(() => firstField?.focus(), 50);
};
const hideModal = id => {
  $(id).classList.remove('is-open');
  if (id === 'confirmModal') {
    pendingDeleteListId = null;
    pendingDeleteProductId = null;
  }
  if (!document.querySelector('.modal.is-open')) document.body.classList.remove('modal-open');
};
const closeOnBackdrop = (event, id) => { if (event.target === $(id)) hideModal(id); };
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') document.querySelectorAll('.modal.is-open').forEach(modal => hideModal(modal.id));
});

const applyTheme = theme => {
  const dark = theme === 'dark';
  document.body.classList.toggle('dark-theme', dark);
  document.querySelectorAll('.theme-toggle').forEach(button => {
    button.textContent = dark ? '☀' : '☾';
    button.setAttribute('aria-label', dark ? 'Usar tema claro' : 'Usar tema escuro');
    button.title = dark ? 'Usar tema claro' : 'Usar tema escuro';
  });
};
const toggleTheme = () => {
  const nextTheme = document.body.classList.contains('dark-theme') ? 'light' : 'dark';
  localStorage.setItem(LOCAL_THEME_KEY, nextTheme);
  applyTheme(nextTheme);
};

const showHome = () => {
  currentListId = null;
  $('shoppingApp').classList.add('is-hidden');
  $('homeScreen').classList.remove('is-hidden');
  renderHome();
};

const renderHome = () => {
  const home = $('homeScreen');
  if (!shoppingLists.length) {
    home.innerHTML = `<button class="theme-toggle empty-theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema" title="Alternar tema">☾</button><section class="home-empty-state"><div class="home-icon">🛒</div><h1>Você ainda não possui listas.</h1><button class="btn-create-list" onclick="openListModal()">Criar nova lista de compras</button></section>`;
    applyTheme(localStorage.getItem(LOCAL_THEME_KEY) || 'light');
    return;
  }
  home.innerHTML = `<section class="home-content"><header class="home-header"><div><p class="home-eyebrow">MINHAS LISTAS</p><h1>Listas de compras</h1></div><span class="home-actions"><button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema" title="Alternar tema">☾</button><button class="btn-create-list" onclick="openListModal()">Criar lista</button></span></header><div class="home-list-grid" id="homeListGrid">${shoppingLists.map(list => `
    <article class="saved-list-card" data-reorder-id="${escapeAttribute(list.id)}" role="button" tabindex="0" onclick="openList('${escapeAttribute(list.id)}')" onkeydown="if(event.key === 'Enter' || event.key === ' ') openList('${escapeAttribute(list.id)}')">
      <span class="saved-list-icon" aria-hidden="true">🛒</span>
      <span class="saved-list-info"><strong>${escapeHtml(list.name)}</strong><small>${list.products.length} ${list.products.length === 1 ? 'produto' : 'produtos'}</small></span>
      <span class="saved-list-actions">
        <button class="btn-card-action clone-list-btn" onclick="cloneList('${escapeAttribute(list.id)}', event)" title="Duplicar lista" aria-label="Duplicar lista ${escapeAttribute(list.name)}">⧉</button>
        <button class="btn-card-action delete-list-btn" onclick="requestDeleteList('${escapeAttribute(list.id)}', event)" title="Excluir lista" aria-label="Excluir lista ${escapeAttribute(list.name)}">🗑</button>
      </span>
      <button class="btn-card-action share-list-btn" onclick="shareList('${escapeAttribute(list.id)}', event)" title="Compartilhar lista" aria-label="Compartilhar lista ${escapeAttribute(list.name)}">🔗</button>
    </article>`).join('')}</div></section>`;
  applyTheme(localStorage.getItem(LOCAL_THEME_KEY) || 'light');
  initializeReordering($('homeListGrid'), 'list');
};

const openListModal = () => {
  listModalMode = 'create';
  $('listModalTitle').textContent = 'Nova lista';
  $('listNameLabel').textContent = 'Nome da lista';
  $('listModalSubmit').textContent = 'Criar lista';
  $('listNameInput').value = '';
  showModal('listModal');
};

const openRenameListModal = () => {
  const list = shoppingLists.find(item => item.id === currentListId);
  if (!list) return;
  listModalMode = 'rename';
  $('listModalTitle').textContent = 'Editar nome da lista';
  $('listNameLabel').textContent = 'Novo nome';
  $('listModalSubmit').textContent = 'Salvar';
  $('listNameInput').value = list.name;
  showModal('listModal');
  setTimeout(() => $('listNameInput').select(), 60);
};

const submitListModal = () => {
  const name = $('listNameInput').value.trim() || 'Lista sem nome';
  if (listModalMode === 'rename') {
    const list = shoppingLists.find(item => item.id === currentListId);
    if (!list) return;
    list.name = name;
    list.updatedAt = Date.now();
    persistLists();
    $('currentListName').textContent = name;
  } else {
    const list = normalizeList({ id: createId(), name, products: [], nextId: 1 });
    shoppingLists.push(list);
    persistLists();
    hideModal('listModal');
    openList(list.id);
    return;
  }
  hideModal('listModal');
};

const cloneList = (id, event) => {
  event.stopPropagation();
  const source = shoppingLists.find(list => list.id === id);
  if (!source) return;
  const base = `${source.name} (cópia)`;
  let name = base, suffix = 2;
  while (shoppingLists.some(list => list.name === name)) name = `${base} ${suffix++}`;
  shoppingLists.unshift(normalizeList({ ...clone(source), id: createId(), name, updatedAt: Date.now() }));
  persistLists();
  renderHome();
};

const buildShareText = list => {
  const items = list.products.map((product, index) => {
    const measurement = formatProductMeasurement(product);
    const label = MEASUREMENTS[product.measurementUnit].kind === 'mass' ? 'Peso' : 'Volume';
    return `${index + 1}. ${product.name}\n- ${label}: ${measurement}\n- Preço unitário: ${formatCurrencyFromCents(product.priceCents)}\n- Quantidade: ${product.quantity}${product.excluded ? '\n- Desconsiderado dos totais' : ''}`;
  });
  return `Lista de Compras — ${list.name}${items.length ? `\n\n${items.join('\n\n')}` : '\n\nNenhum item na lista.'}`;
};

const shareList = async (id, event) => {
  event.stopPropagation();
  const list = shoppingLists.find(item => item.id === id);
  if (!list) return;
  const text = buildShareText(list);
  try {
    if (navigator.share) {
      await navigator.share({ title: `Lista de Compras — ${list.name}`, text });
      return;
    }
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      alert('Texto da lista copiado. Cole no WhatsApp, e-mail ou outro aplicativo.');
      return;
    }
  } catch (error) {
    if (error.name === 'AbortError') return;
  }
  window.prompt('Copie o texto da lista:', text);
};

// O módulo é opcional: sem Ddrop.js, o restante do aplicativo continua operando.
const initializeReordering = (container, type) => {
  if (!window.Ddrop?.initialize) return;
  window.Ddrop.initialize(container, type, order => {
    if (type === 'list') {
      shoppingLists = order.map(id => shoppingLists.find(list => list.id === id)).filter(Boolean);
      persistLists();
      ignoreNextListOpen = true;
      setTimeout(() => { ignoreNextListOpen = false; }, 0);
      return;
    }
    products = order.map(id => products.find(product => String(product.id) === id)).filter(Boolean);
  });
};

const requestDeleteList = (id, event) => {
  event.stopPropagation();
  const list = shoppingLists.find(item => item.id === id);
  if (!list) return;
  pendingDeleteListId = id;
  pendingDeleteProductId = null;
  $('confirmModalTitle').textContent = 'Excluir lista?';
  $('confirmModalText').textContent = `A lista “${list.name}” e todos os seus produtos serão excluídos. Esta ação não pode ser desfeita.`;
  $('confirmModalAction').textContent = 'Excluir permanentemente';
  showModal('confirmModal');
};
const confirmPendingDeletion = () => {
  if (pendingDeleteProductId !== null) {
    products = products.filter(product => product.id !== pendingDeleteProductId);
    pendingDeleteProductId = null;
    renderProducts();
    updateTotals();
  } else if (pendingDeleteListId) {
    shoppingLists = shoppingLists.filter(list => list.id !== pendingDeleteListId);
    pendingDeleteListId = null;
    persistLists();
    renderHome();
  } else {
    return;
  }
  hideModal('confirmModal');
};

const openList = id => {
  if (ignoreNextListOpen) return;
  const list = shoppingLists.find(item => item.id === id);
  if (!list) return;
  currentListId = id;
  products = clone(list.products);
  originalProducts = clone(list.products);
  nextId = Math.max(Number(list.nextId) || 1, getNextProductId(products));
  lastTotalCents = null;
  $('currentListName').textContent = list.name;
  $('homeScreen').classList.add('is-hidden');
  $('shoppingApp').classList.remove('is-hidden');
  renderProducts();
  updateTotals();
};

const requestGoHome = () => currentListId ? showModal('leaveListModal') : showHome();
const saveAndGoHome = () => {
  const list = shoppingLists.find(item => item.id === currentListId);
  if (list) { list.products = clone(products); list.nextId = nextId; list.updatedAt = Date.now(); persistLists(); }
  hideModal('leaveListModal');
  showHome();
};
const discardAndGoHome = () => { products = clone(originalProducts); hideModal('leaveListModal'); showHome(); };

const weightInput = $('productWeight');
const priceInput = $('productPrice');
const quantityInput = $('productQuantity');
const weightUnitInput = $('productWeightUnit');
const nameInput = $('productName');
const changeQuantity = delta => { quantityInput.value = Math.max(1, (Number.parseInt(quantityInput.value, 10) || 1) + delta); };

[priceInput, weightInput].forEach(input => {
  input.addEventListener('input', () => { input.value = normalizeBrazilianDecimalInput(input.value); });
  input.addEventListener('blur', () => {
    if (!input.value) return;
    const number = parseBrazilianNumber(input.value);
    if (!Number.isFinite(number)) return;
    input.value = input === priceInput
      ? formatBrazilianNumber(number, 2, 2)
      : formatBrazilianNumber(number, 0, 6);
  });
});

const openProductModal = () => {
  editingProductId = null;
  $('productModalTitle').textContent = 'Adicionar produto';
  $('productForm').reset();
  quantityInput.value = 1;
  weightUnitInput.value = 'kg';
  showModal('productModal');
};
const editProduct = id => {
  const product = products.find(item => item.id === id);
  if (!product) return;
  editingProductId = id;
  $('productModalTitle').textContent = 'Editar produto';
  nameInput.value = product.name;
  priceInput.value = formatBrazilianNumber(product.priceCents / 100, 2, 2);
  quantityInput.value = product.quantity;
  weightUnitInput.value = product.measurementUnit;
  weightInput.value = formatBrazilianNumber(product.measurement / MEASUREMENTS[product.measurementUnit].factor, 0, 6);
  showModal('productModal');
};

const saveProduct = event => {
  event.preventDefault();
  const priceCents = parseBrazilianMoneyToCents(priceInput.value);
  const quantity = Number.parseInt(quantityInput.value, 10);
  const enteredWeight = parseBrazilianNumber(weightInput.value);
  if (!(priceCents > 0) || !(quantity >= 1) || (weightInput.value.trim() !== '' && !(enteredWeight >= 0))) return;
  const measurementUnit = MEASUREMENTS[weightUnitInput.value] ? weightUnitInput.value : 'kg';
  const measurement = Number.isFinite(enteredWeight) ? enteredWeight * MEASUREMENTS[measurementUnit].factor : 0;
  const changes = { name: nameInput.value.trim() || 'Item sem nome', price: priceCents / 100, priceCents, quantity, measurement, measurementUnit };
  if (editingProductId === null) products.push({ id: nextId++, ...changes, excluded: false });
  else Object.assign(products.find(item => item.id === editingProductId), changes);
  renderProducts();
  updateTotals();
  hideModal('productModal');
};

const requestRemoveProduct = id => {
  const product = products.find(item => item.id === id);
  if (!product) return;
  pendingDeleteProductId = id;
  pendingDeleteListId = null;
  $('confirmModalTitle').textContent = 'Excluir produto?';
  $('confirmModalText').textContent = `O produto “${product.name}” será removido da lista. Esta ação não pode ser desfeita.`;
  $('confirmModalAction').textContent = 'Excluir produto';
  showModal('confirmModal');
};
const toggleProductExcluded = id => {
  const product = products.find(item => item.id === id);
  if (product) { product.excluded = !product.excluded; renderProducts(); updateTotals(); }
};

const updateTotals = () => {
  const considered = products.filter(product => !product.excluded);
  const totalCents = considered.reduce((sum, product) => sum + product.priceCents * product.quantity, 0);
  const totalMass = considered.filter(product => MEASUREMENTS[product.measurementUnit].kind === 'mass').reduce((sum, product) => sum + product.measurement * product.quantity, 0);
  const totalVolume = considered.filter(product => MEASUREMENTS[product.measurementUnit].kind === 'volume').reduce((sum, product) => sum + product.measurement * product.quantity, 0);
  const totalElement = $('totalPrice');
  totalElement.textContent = formatCurrencyFromCents(totalCents);
  totalElement.classList.toggle('is-over-budget', totalCents >= 10000);
  lastTotalCents = totalCents;
  const measures = [];
  if (totalMass || !totalVolume) measures.push(`Peso total: ${formatTotalWeight(totalMass)}`);
  if (totalVolume) measures.push(`Volume total: ${formatTotalVolume(totalVolume)}`);
  $('totalWeight').textContent = measures.join(' · ');
};

const renderProducts = () => {
  const container = $('productList');
  if (!products.length) { container.innerHTML = '<p class="empty-state">Nenhum item ainda.<br>Toque em + para adicionar.</p>'; return; }
  container.innerHTML = products.map(product => `<article class="product-card ${product.excluded ? 'excluded' : ''}" data-reorder-id="${product.id}">
    <div class="product-info"><span class="product-qty">${product.quantity}×</span><span class="product-price">${formatCurrencyFromCents(product.priceCents)}</span><div class="product-details"><span class="product-name">${escapeHtml(product.name)}</span><span class="product-weight">${formatProductMeasurement(product)} un.</span></div></div>
    <div class="product-actions"><button class="action-btn exclude-btn ${product.excluded ? 'active' : ''}" onclick="toggleProductExcluded(${product.id})" title="${product.excluded ? 'Considerar item nos totais' : 'Desconsiderar item dos totais'}" aria-label="${product.excluded ? 'Considerar item' : 'Desconsiderar item'}">A̶</button><button class="action-btn edit-btn" onclick="editProduct(${product.id})" title="Editar produto" aria-label="Editar produto">✎</button><button class="remove-btn" onclick="requestRemoveProduct(${product.id})" title="Excluir produto" aria-label="Excluir produto">🗑</button></div>
  </article>`).join('');
  initializeReordering(container, 'product');
};

const formatProductMeasurement = product => `${formatBrazilianNumber(product.measurement / MEASUREMENTS[product.measurementUnit].factor, 0, 6)} ${MEASUREMENTS[product.measurementUnit].label}`;
const escapeHtml = value => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const escapeAttribute = value => escapeHtml(value).replace(/'/g, '&#39;');

window.addEventListener('load', () => { loadLists(); applyTheme(localStorage.getItem(LOCAL_THEME_KEY) || 'light'); showHome(); });
